[package]
name = "pouch-desktop"
description = "Pouch desktop shell. Hosts the webview and bridges it to pouch-core."
version = "0.1.6"
edition = "2021"
rust-version = "1.89"
license = "AGPL-3.0-or-later"
authors = ["Le Do Nguyen Tu"]

# Not a workspace member: it needs GTK and WebKitGTK at build time, which most
# jobs do not install. Built by the dedicated desktop CI job.
#
# Because it is outside the workspace it needs its own Cargo.lock, and that lock
# file is committed. Without it every CI run re-resolves transitive versions
# from scratch, which is how this crate broke: `tauri-build` was pinned but its
# transitive `tauri-utils` was not, so a newer `tauri-utils` with a changed
# function signature was picked up and the build stopped compiling. Exact pins
# on direct dependencies do not constrain the graph beneath them — only a lock
# file does. See DECISIONS.md D-029.
#
# The empty [workspace] table below is a second, independent way of saying
# "never fold this into an ancestor workspace" — the root Cargo.toml already
# excludes this path from its own [workspace], but that only stops Cargo's
# upward directory search at *that* Cargo.toml. It does not stop the search if
# this crate is reached through a different ancestor entirely, which is
# exactly what happens when it is checked out inside a nested git worktree
# (e.g. `.worktrees/<name>/clients/desktop/src-tauri`): Cargo's walk finds the
# worktree's own excluding Cargo.toml, honours the exclusion, keeps walking
# past it, and lands on whatever workspace sits above the worktree instead —
# which does not know this path exists and fails to resolve. An empty
# [workspace] here stops the walk at this crate unconditionally, regardless
# of what sits above it.
[workspace]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
pouch-core = { path = "../../../core" }
tauri = { version = "=2.11.5", features = [] }
serde = { version = "=1.0.225", features = ["derive"] }
serde_json = "=1.0.134"
tokio = { version = "=1.53.1", features = ["sync"] }
# Same exact pin the rest of the workspace already uses (root Cargo.toml) for
# encoding the recovery key the backup screen displays — this crate sits
# outside the workspace so it needs its own copy of the pin, not a new
# dependency decision.
hex = "=0.4.3"

[lints.rust]
unsafe_code = "forbid"
