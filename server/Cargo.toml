[package]
name = "pouch-relay"
description = "Opaque blob queue. Stores no identity, writes no logs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
axum.workspace = true
tokio = { workspace = true, features = ["full"] }
tower-http.workspace = true
rusqlite.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
hex.workspace = true
base64.workspace = true

# The onion service (Phase 4, D-039). `hyper-util`'s server side is what
# bridges each accepted Tor stream into the same axum Router the direct
# listener uses — axum 0.7's `serve` only accepts a concrete TcpListener.
arti-client.workspace = true
tor-hsservice.workspace = true
tor-rtcompat.workspace = true
tor-cell.workspace = true
safelog.workspace = true
rustls.workspace = true
futures-util.workspace = true
hyper-util.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
reqwest = { workspace = true, features = ["json"] }
tempfile.workspace = true

[lints.rust]
unsafe_code = "forbid"
