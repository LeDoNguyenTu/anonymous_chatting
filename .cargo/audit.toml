# cargo-audit configuration.
#
# SPEC §2.1 requires `cargo audit` to fail the build on known vulnerabilities.
# It does. This file is the narrow, documented exception list for advisories
# that cannot currently be fixed, and every entry below states *why* — an
# undocumented ignore is indistinguishable from not running the audit at all.
#
# The rule for adding an entry: an advisory may be ignored only if it cannot be
# resolved by upgrading, AND the exposure has been reasoned about and written
# down here. "It is noisy" is not a reason. Every entry is revisited whenever
# `openmls` is upgraded, because most of them exist only because `openmls`
# pins them.
#
# Full reasoning, including which advisories are reachable at all, is in
# docs/DECISIONS.md D-030.

[advisories]
ignore = [
    # ---------------------------------------------------------------------
    # Blocked upstream: openmls_rust_crypto 0.5.0 requires hpke-rs ^0.5.1,
    # and the fixes landed in hpke-rs 0.6.0. There is no newer
    # openmls_rust_crypto. These cannot be resolved without either a new
    # openmls release or vendoring the crypto provider, and vendoring an
    # audited crypto library to dodge an advisory is a worse outcome than the
    # advisory.
    # ---------------------------------------------------------------------

    # Nonce reuse in a *reusable* HPKE context after 2^32 seal/open operations
    # on that one context. MLS uses HPKE for single-shot operations — key
    # package encryption and Welcome — not a long-lived context driven four
    # billion times. Reachable in principle, unreachable in this usage.
    "RUSTSEC-2026-0071",

    # Panic when an HPKE context configured with HpkeExport as its AEAD is
    # asked to seal or open. Pouch's ciphersuite sets AES-128-GCM as the AEAD;
    # HpkeExport is never selected.
    "RUSTSEC-2026-0070",

    # Incorrect length encoding when exporting a secret longer than 65535
    # bytes. MLS exporter outputs are tens of bytes.
    "RUSTSEC-2026-0069",

    # Missing check that the X25519 shared secret is non-zero, in the
    # RustCrypto backend that this project does use. This is the one with real
    # substance — see D-030, which explains why it is accepted for now and
    # what would change that.
    "RUSTSEC-2026-0072",

    # ---------------------------------------------------------------------
    # libcrux, pulled in transitively by hpke-rs. Same upstream block.
    # ---------------------------------------------------------------------

    # SHAKE incremental-squeeze bugs. Pouch's ciphersuite uses SHA-256, not
    # SHA-3/SHAKE, and both advisories state they do not affect ML-KEM or
    # ML-DSA use either. No SHAKE XOF call exists in this project.
    "RUSTSEC-2026-0074",
    "RUSTSEC-2026-0207",
    # AVX2 SHAKE-256 out-of-bounds panic, same reasoning.
    "RUSTSEC-2026-0208",

    # Constant-time swap/select is incorrect on aarch64: the inline assembly
    # compared a 32-bit register against an 8-bit selector, folding in 24
    # unspecified high bits, so `Select::select` and `Swap::swap` could return
    # the wrong result. Fixed in libcrux-secrets 0.0.6.
    #
    # **Re-checked 2026-08-09, when the Android client landed (Phase 5), which
    # is what the previous note here asked for. The finding changed.** This
    # crate is now genuinely compiled for aarch64:
    # `cargo tree -i libcrux-traits --target aarch64-linux-android` resolves
    # libcrux-secrets 0.0.5 -> libcrux-traits -> libcrux-sha3 -> hpke-rs ->
    # openmls_rust_crypto -> pouch-core. The earlier wording, "nothing in the
    # compiled graph calls it", described an x86_64-only project and no longer
    # describes this one.
    #
    # Still accepted, on two grounds rather than the old one:
    #
    # 1. The advisory's own impact assessment is availability only — CVSS 4.0
    #    VC:N/VI:N/VA:H. A wrong result from these primitives is a correctness
    #    and liveness problem, not a key or plaintext disclosure.
    # 2. The path that reaches it is libcrux-sha3's SHAKE code, and Pouch's
    #    ciphersuite is SHA-256 throughout. That is the same reasoning already
    #    recorded above for RUSTSEC-2026-0074, -0207 and -0208: the crate
    #    compiles in, the SHAKE entry points are never called.
    #
    # Cannot be resolved by upgrading: libcrux-traits 0.0.5 requires
    # libcrux-secrets 0.0.5, and 0.0.6 is a semver-incompatible bump under
    # Cargo's 0.0.x rules. `cargo update -p libcrux-secrets` moves nothing.
    # Blocked behind the same openmls release the entries above wait on.
    #
    # This becomes urgent, not merely accepted, if anything here ever selects
    # a SHA-3 or SHAKE-based ciphersuite.
    "RUSTSEC-2026-0212",

    # ---------------------------------------------------------------------
    # libcrux crates that are in Cargo.lock but are never compiled.
    #
    # cargo-audit reads the lock file, which records the resolution for
    # optional dependencies that no enabled feature selects. Verified not
    # reachable: `cargo tree -i <crate> --target all -e all` reports nothing
    # for each, and no build artifact for them exists after a full build.
    # They enter the lock through hpke-rs's libcrux backend, which
    # openmls_rust_crypto does not enable — it uses the RustCrypto backend.
    #
    # Re-verify these the moment the crypto backend changes.
    # ---------------------------------------------------------------------

    # Non-constant-time AES-GCM tag check, and unbounded AAD length.
    "RUSTSEC-2026-0211",
    "RUSTSEC-2026-0209",
    # libcrux-aesgcm renamed to libcrux-aes. A rename notice, not a defect.
    "RUSTSEC-2026-0210",
    # Panic on overlong ChaCha20-Poly1305 ciphertext buffer.
    "RUSTSEC-2026-0124",
    # X25519 secret validation missing length check and clamping.
    "RUSTSEC-2026-0023",
    # Panic in standalone Poly1305 MAC operations.
    "RUSTSEC-2026-0073",

    # ---------------------------------------------------------------------
    # rand 0.8.5, required by openmls_rust_crypto. rand 0.9/0.10 is a
    # semver-incompatible jump the whole MLS stack would have to make
    # together.
    # ---------------------------------------------------------------------

    # Unsoundness when a *custom logger* calls rand::rng() re-entrantly. Pouch
    # installs no logger at all — the relay explicitly disables logging (SPEC
    # §2.3) and the core logs nothing. The precondition cannot occur.
    "RUSTSEC-2026-0097",

    # ---------------------------------------------------------------------
    # rsa 0.9.10, pulled in by the arti dependency tree (Phase 4, D-039):
    # arti-client -> tor-hscrypto -> tor-key-forge -> ssh-key-fork-arti -> rsa.
    # Not optional at any link — tor-key-forge depends on it directly, and
    # ssh-key-fork-arti's `rsa` feature is enabled — so it genuinely compiles
    # in rather than merely sitting in the lock file.
    # ---------------------------------------------------------------------

    # Marvin Attack: key recovery through timing sidechannels in RSA. The
    # advisory has no fixed upgrade — the maintainers state a constant-time
    # implementation needs a rewrite — so the only alternatives are dropping
    # arti (SPEC §3.2 names it for Phase 4 transport) or vendoring it, and
    # vendoring an audited crypto library to dodge an advisory is a worse
    # outcome than the advisory.
    #
    # The vulnerable operation is RSA *private-key decryption*, whose timing
    # leaks to an attacker who can submit ciphertexts and measure responses.
    # Pouch performs no RSA operations of its own at all: its ciphersuite is
    # X25519 / Ed25519 / AES-128-GCM, and v3 onion services are ed25519 and
    # curve25519 throughout. RSA reaches the graph through arti's SSH-format
    # key *storage* support. Where the Tor protocol does still use RSA — legacy
    # relay identity keys in directory documents — it is signature
    # verification, a public-key operation the advisory does not cover.
    #
    # Re-check on any arti upgrade, and specifically if this project ever
    # starts handling an RSA key for any reason.
    "RUSTSEC-2023-0071",

    # ---------------------------------------------------------------------
    # Unmaintained crates. Not vulnerabilities; flagged so they stay visible.
    # ---------------------------------------------------------------------

    # rustls-pemfile, via reqwest 0.12. Parses PEM. Pouch does not parse PEM
    # today: Phases 1–3 pin the relay by SPKI hash rather than reading a
    # certificate file (D-017). Re-check when real TLS lands.
    "RUSTSEC-2025-0134",

    # proc-macro-error2 — a build-time macro helper, not in the compiled
    # dependency graph of any binary.
    "RUSTSEC-2026-0173",
]
