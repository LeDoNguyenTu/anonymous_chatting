[workspace]
resolver = "2"
members = ["core", "server", "clients/cli"]
# The Tauri shell needs GTK and WebKitGTK at build time. Excluding it keeps
# `cargo build --workspace` usable on a headless machine; it has its own CI job.
exclude = ["clients/desktop/src-tauri"]

[workspace.package]
version = "0.1.2"
edition = "2021"
rust-version = "1.89"
license = "AGPL-3.0-or-later"
authors = ["Le Do Nguyen Tu"]
repository = "https://github.com/LeDoNguyenTu/anonymous_chatting"

# Exact versions are pinned deliberately (SPEC 2.1). `openmls` changes its API
# between minor versions; an unpinned bump is a silent break in key handling.
# Any change to a version here requires an entry in docs/DECISIONS.md.
[workspace.dependencies]
# --- MLS (RFC 9420) -------------------------------------------------------
openmls = "=0.8.1"
openmls_rust_crypto = "=0.5.0"
openmls_traits = "=0.5.0"
openmls_basic_credential = "=0.5.0"
openmls_memory_storage = "=0.5.0"

# --- primitives (library only, never reimplemented) -----------------------
argon2 = "=0.5.3"
rand = "=0.8.5"
sha2 = "=0.10.9"
subtle = "=2.6.1"
zeroize = { version = "=1.8.1", features = ["zeroize_derive"] }

# --- storage --------------------------------------------------------------
# `bundled` builds SQLite from source so the relay does not inherit whatever
# version the host happens to ship. The relay database is deliberately NOT
# SQLCipher — see DECISIONS.md D-019.
# One rusqlite for the whole workspace, built with SQLCipher.
#
# It cannot be two. Cargo unifies features across a workspace for a single
# package version, so declaring a plain `bundled` build alongside a
# `bundled-sqlcipher` one produces one library with the union of the features —
# and the plain SQLite build wins. The result is a `PRAGMA key` that is silently
# ignored, because SQLite ignores pragmas it does not recognise, and a database
# the application believes is encrypted and which is not. See D-024.
#
# The relay links the same library and simply never sets a key, which is the
# behaviour D-019 wants: its database holds nothing worth protecting and must
# not pretend otherwise.
#
# Bumped from 0.32.1 to 0.39.0 for Phase 4 — arti-client's tor-dirmgr
# component requires rusqlite >=0.36.0,<0.40.0 and the two cannot coexist as
# separate versions (both link the native sqlite3 library). See D-040.
# `bundled-sqlcipher` is confirmed still present at 0.39.0. This forces the
# thiserror and serde bumps below via arti-client's own transitive tree, and
# requires three `as i64` casts in server/src/store.rs — see D-040 for why.
rusqlite = { version = "=0.39.0", features = ["bundled-sqlcipher"] }

# --- transport / server ---------------------------------------------------
axum = "=0.7.9"
reqwest = { version = "=0.12.9", default-features = false, features = ["json", "rustls-tls-manual-roots"] }
rustls = "=0.23.20"
tokio = "=1.53.1"
tower-http = "=0.6.2"

# --- Tor transport (Phase 4) ------------------------------------------------
# D-039: arti-client/tor-hsservice/tor-rtcompat pinned at 0.43.0 — the newest
# release, 0.44.0, needs Rust 1.91 and failed its own docs.rs build; 0.43.0
# needs 1.89 (which rust-version above now declares) and built cleanly.
# `onion-service-service` enables `TorClient::launch_onion_service`, which the
# relay needs to *be* an onion service. `onion-service-client` is what allows
# `TorClient::connect` to accept a `.onion` address at all — without it arti
# rejects one at runtime with "feature onion-service-client not compiled in",
# not at compile time, so the client transport would build fine and fail in
# the field. Found by actually running a circuit; see D-042.
arti-client = { version = "=0.43.0", default-features = false, features = ["tokio", "rustls", "onion-service-client", "onion-service-service"] }
tor-hsservice = "=0.43.0"
tor-rtcompat = { version = "=0.43.0", features = ["tokio"] }

# reqwest has no hook for a custom low-level connector, and arti-client has no
# in-process SOCKS listener (only the separate `arti` CLI binary does, which
# would mean shelling out to a subprocess — against this project's rule of
# using an audited library through its intended interface). The Tor-routed
# transport is therefore built directly on hyper/hyper-util instead, which is
# also what bridges the relay's onion-service streams into axum server-side —
# one new dependency category serving both directions, not two.
hyper = "=1.11.0"
hyper-util = { version = "=0.1.20", features = ["client-legacy", "server-auto", "tokio", "service"] }
http-body-util = "=0.1.4"
futures-util = "=0.3.33"
http = "=1.5.0"
tower-service = "=0.3.3"
bytes = "=1.12.1"

# --- payload --------------------------------------------------------------
zstd = "=0.13.2"
# Edits JPEG/PNG/WebP containers directly to strip EXIF/GPS/ICC without
# decoding or re-encoding pixel data. D-038: the maintained library SPEC
# §7.1 requires for attachment metadata stripping, scoped to images —
# video is explicitly out of scope this phase, same entry.
img-parts = "=0.4.0"

# --- plumbing -------------------------------------------------------------
anyhow = "=1.0.104"
base64 = "=0.22.1"
hex = "=0.4.3"
serde = { version = "=1.0.225", features = ["derive"] }
serde_json = "=1.0.134"
thiserror = "=2.0.19"
uuid = { version = "=1.11.0", features = ["v4", "serde"] }
tempfile = "=3.14.0"

[profile.release]
# Secrets must not survive in unwind landing pads we cannot reason about.
panic = "abort"
