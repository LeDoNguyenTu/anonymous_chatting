[package]
name = "pouch-core"
description = "All security-relevant logic for Pouch. Clients are thin UI over this crate."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
openmls.workspace = true
openmls_rust_crypto.workspace = true
openmls_traits.workspace = true
openmls_basic_credential.workspace = true
openmls_memory_storage.workspace = true

argon2.workspace = true
rand.workspace = true
sha2.workspace = true
subtle.workspace = true
zeroize.workspace = true

rusqlite.workspace = true

reqwest.workspace = true
tokio.workspace = true
zstd.workspace = true

base64.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tempfile.workspace = true
# The relay, so the end-to-end path is exercised against the real server rather
# than a mock that cannot disagree with it. No cycle: the relay does not depend
# on the core.
pouch-relay = { path = "../server" }
axum.workspace = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# A panic in the crypto path is a denial of service at best. Surface them.
unwrap_used = "warn"
expect_used = "warn"
