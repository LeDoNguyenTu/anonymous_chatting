name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # A dependency that fails to build should fail loudly rather than warn.
  RUSTFLAGS: "-D warnings"

jobs:
  guardrails:
    name: Guardrails (SPEC 8.8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The guardrail script uses `git grep`, which needs real history
          # rather than a shallow blob-less checkout.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Forbidden logging, marketing terms, relay logging, weak RNG
        run: ./scripts/check-guardrails.sh
      - name: Contrast ratios on the token palette
        run: node scripts/check-contrast.mjs

  rust:
    name: Rust — build, test, clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Test
        run: cargo test --workspace

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Run cargo-audit directly rather than through an action wrapper.
      #
      # The wrapper posts its result as a GitHub check run, which needs a token
      # permission this workflow does not grant — so it failed with "Resource
      # not accessible by integration" *after* completing the scan, turning a
      # permissions problem into what looked like an audit failure. Running the
      # tool means the job's own exit status is the result, with nothing in
      # between to misreport it.
      #
      # The advisories that cannot currently be fixed are listed, each with its
      # reasoning, in .cargo/audit.toml. That file is the audit's exception
      # list and is reviewed whenever openmls is upgraded.
      # A prebuilt binary. `cargo install cargo-audit` compiles it from source on
      # every run, which took over five minutes and dominated the job.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Audit dependencies
        run: cargo audit

  frontend:
    name: Desktop frontend — typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: clients/desktop/package-lock.json
      - run: npm ci
      - name: npm audit
        # Production dependencies only. A vulnerability in a build-time
        # devDependency does not ship to a user, and failing on those turns the
        # signal into noise that gets ignored.
        run: npm audit --omit=dev --audit-level=moderate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  desktop-shell:
    name: Tauri shell — build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/desktop/src-tauri
      - name: System dependencies for WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libgtk-3-dev
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: clients/desktop/package-lock.json
      - name: Build frontend
        working-directory: clients/desktop
        run: |
          npm ci
          npm run build
      # Before `cargo check`, not only before `tauri build`. `tauri-build` runs
      # in build.rs and validates every declared externalBin against the *host*
      # triple, so a missing sidecar fails compilation, not just bundling —
      # which is how this job broke when the relay was first bundled (D-052).
      #
      # Running the real staging script rather than touching a placeholder file
      # is the point: it exercises the triple-suffix logic on Linux as well as
      # Windows, and a placeholder would let the script rot on one platform
      # while CI stayed green.
      - name: Stage the relay sidecar for this runner's target
        run: ./scripts/stage-relay-sidecar.sh
      - name: Check the shell compiles
        working-directory: clients/desktop/src-tauri
        # --locked, because this crate is outside the workspace and its
        # committed Cargo.lock is the only thing pinning its transitive
        # dependencies. Without it CI re-resolves and can pick up a
        # semver-compatible but source-incompatible upgrade, which is exactly
        # how this job broke (D-029).
        run: cargo check --all-targets --locked

  android-bridge:
    name: Android JNI bridge — test, clippy, cross-compile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/android/jni
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          # The four ABIs Play requires a release APK to cover. arm64 and
          # armv7 are real phones; the two x86 targets are emulators, which is
          # how anyone without a device runs this at all.
          targets: >-
            aarch64-linux-android,
            armv7-linux-androideabi,
            x86_64-linux-android,
            i686-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/android/jni

      # Host first, because it is the only step that runs the code rather than
      # just compiling it. A cross-compile proves the ABIs link; these prove
      # the bridge behaves. If both are going to fail, this should fail first.
      - name: Format
        run: cargo fmt -- --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test on the host
        run: cargo test --locked

      # The repo-root `cargo audit` job reads the workspace lock file. This
      # crate has its own, so its transitive tree would otherwise be the one
      # part of the project nothing scans. Same exception list, because the
      # advisories it accepts are properties of openmls, not of a client.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Audit this crate's own lock file
        # Run from the repository root, because that is where .cargo/audit.toml
        # lives and cargo-audit resolves its config relative to the working
        # directory. From inside this crate the exception list would be
        # invisible and the job would fail on advisories that have already been
        # assessed and written down — which trains people to ignore it.
        working-directory: .
        run: cargo audit --file clients/android/jni/Cargo.lock

      # The NDK is preinstalled on this runner image; ANDROID_NDK_LATEST_HOME
      # points at it. cargo-ndk supplies the linker and sysroot flags each
      # target needs, which is the part that is tedious to get right by hand.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - name: Cross-compile for every shipped ABI
        # --locked because this crate is outside the workspace and its
        # committed Cargo.lock is the only thing pinning its transitive
        # dependencies (D-029). Without it CI re-resolves and can pick up a
        # semver-compatible but source-incompatible upgrade — which is exactly
        # how the desktop shell broke once already.
        run: |
          cargo ndk \
            -t arm64-v8a \
            -t armeabi-v7a \
            -t x86_64 \
            -t x86 \
            build --release --locked

      - name: Confirm every ABI actually produced a library
        # `cargo ndk` exiting 0 is not the same as four .so files existing. A
        # target that silently produced nothing would otherwise ship as an APK
        # that crashes on exactly the devices nobody tested. This is the D-024
        # pattern: check that the thing did what it was configured to do.
        run: |
          set -eu
          missing=0
          for target in aarch64-linux-android armv7-linux-androideabi \
                        x86_64-linux-android i686-linux-android; do
            so="target/$target/release/libpouch_jni.so"
            if [ -f "$so" ]; then
              echo "ok   $target  $(stat -c%s "$so") bytes"
            else
              echo "MISSING  $so"
              missing=1
            fi
          done
          exit "$missing"

  android-app:
    name: Android app — lint, unit tests, assemble
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/android
    steps:
      - uses: actions/checkout@v4

      # AGP 8.7 supports JDK 17 through 21. The default JDK on this runner
      # moves over time, so it is pinned rather than inherited — a runner image
      # bump to JDK 24 would otherwise fail this job for a reason unrelated to
      # any change in the code.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # No Gradle wrapper is committed — the wrapper is a binary jar, and this
      # action supplies Gradle itself.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # Unit tests first. These are the only part of the Android client that
      # actually runs anywhere: plain JVM tests over the Custody Strip's state
      # mapping, which is where that component can tell the user something
      # untrue. Everything else here is a compile check.
      - name: Unit tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Lint
        run: gradle :app:lintDebug --no-daemon

      # assembleDebug rather than assembleRelease: a release build requires the
      # four cross-compiled .so files, and this job deliberately does not build
      # them — the android-bridge job above does, and duplicating a fifteen-
      # minute Rust cross-compile here would buy nothing. A debug APK without
      # jniLibs will throw UnsatisfiedLinkError if it is ever run, which is
      # correct: it is a compile artifact, not something to install.
      - name: Assemble a debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Confirm the manifest requests INTERNET and nothing else
        # SPEC §2.2 is a promise about what this app can do, and a permission
        # can arrive transitively from a library's own manifest during merge
        # without anyone editing AndroidManifest.xml. Checking the *merged*
        # manifest is the only way to know what actually ships.
        run: |
          set -eu
          merged=app/build/intermediates/merged_manifests/debug/processDebugManifest/AndroidManifest.xml
          if [ ! -f "$merged" ]; then
            merged=$(find app/build/intermediates -name AndroidManifest.xml -path '*merged*' | head -1)
          fi
          echo "Checking $merged"
          granted=$(grep -oE 'android:name="android\.permission\.[A-Z_]+"' "$merged" \
                    | sed 's/.*permission\.//; s/"//' | sort -u)
          echo "Permissions requested:"
          echo "$granted" | sed 's/^/  /'
          if [ "$granted" != "INTERNET" ]; then
            echo "FAIL: SPEC 2.2 allows INTERNET only in Phase 5."
            exit 1
          fi
          echo "ok: INTERNET only"
